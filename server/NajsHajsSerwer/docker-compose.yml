version: "3.9"

services:
  db:
    image: postgres:14.4-alpine
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"
  test:
    build:
      target: test
      context: .
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - BASE_URL=http://localhost:3000
      - ERROR_LOG_FILE=/home/appuser/error.log
      - INFO_LOG_FILE=/home/appuser/info.log
      - MEDIA_URL=media/
      - MEDIA_ROOT=.
      - STATIC_ROOT=static
      - ADMIN_EMAIL=admin@example.com
    depends_on:
      - db
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"